[pytest]
DJANGO_SETTINGS_MODULE = nhl_web_app.settings
python_files = tests.py test_*.py *_tests.py tests_*.py
addopts = -m "not external and not browser"
markers =
    unit: deterministic unit tests
    integration: deterministic integration tests
    external: tests that call external APIs/services
    browser: Chromium smoke checks requiring optional Node dependencies and cached assets
