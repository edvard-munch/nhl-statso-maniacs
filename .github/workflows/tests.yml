name: Offline regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Reviewed OpenAPI contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Intentionally no database service, deployment environment or test credentials.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.10.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check reviewed schema drift
        run: make schema-check

  client:
    name: TypeScript API client
    needs: schema
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Uses only the reviewed schema; no Django/database/NHL service is needed.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.node-version
      - name: Install pinned client dependencies
        run: make frontend-sync
      - name: Check generated client drift
        run: make api-client-check
      - name: Check TypeScript contracts
        run: make frontend-typecheck
      - name: Test client transport and generation
        run: make frontend-test

  tests:
    # Keep this interpreter in sync with .python-version.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nhl_ci
          POSTGRES_USER: nhl_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nhl_ci -d nhl_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browser-cache/browsers
      CI: "true"
      DEBUG: "false"
      SECRET_KEY: ci-only-django-key
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: nhl_ci
      POSTGRES_USER: nhl_ci
      POSTGRES_DB_PASSWORD: ci-only-password
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_HOST_USER: ci@example.invalid
      EMAIL_PASSWORD: unused
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.10.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install and check locked dependencies
        run: |
          uv sync --locked
          uv pip check
          make requirements-check
      - name: Static checks
        run: |
          make lint
          node --check players/static/players/sorter_players.js
          node --check players/static/players/ajax_switch_stats.js
          node --check players/static/players/sorting_favorites.js
          node --check players/static/players/sorting_comparison.js
          node --check players/static/players/ajax_csrf.js
          node --check players/static/players/ajax_add_fav.js
          node --check players/static/players/ajax_del_fav.js
          node --check players/static/players/ajax_del_fav_favorite_page.js
          node --check players/static/players/ajax_add_comp.js
          node --check players/static/players/ajax_del_comp.js
      - name: Django system and migration checks
        run: |
          uv run --locked python --version
          uv run --locked python -m django --version
          uv run --locked python manage.py check
          uv run --locked python manage.py makemigrations --check --dry-run
      - name: Offline tests and coverage gate
        id: tests
        # pytest-django creates test_nhl_ci using real migrations.
        run: make test-ci
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - name: Prepare offline Chromium smoke tests
        run: |
          npm --prefix browser ci --ignore-scripts
          uv run --locked python scripts/prepare_browser_assets.py
          npm --prefix browser exec -- playwright install --with-deps --no-shell chromium
      - name: Browser smoke tests
        run: uv run --locked python -m pytest -c players/tests/pytest.ini -m "browser and not external" players/tests/browser
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failures
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Export coverage report
        if: always() && hashFiles('.coverage') != ''
        run: uv run --locked python -m coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('coverage.xml') != ''
        with:
          name: coverage-python312
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14
