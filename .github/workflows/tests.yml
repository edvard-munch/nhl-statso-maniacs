name: Offline regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Keep this interpreter in sync with .python-version.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nhl_ci
          POSTGRES_USER: nhl_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nhl_ci -d nhl_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browser-cache/browsers
      CI: "true"
      DEBUG: "false"
      SECRET_KEY: ci-only-django-key
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: nhl_ci
      POSTGRES_USER: nhl_ci
      POSTGRES_DB_PASSWORD: ci-only-password
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_HOST_USER: ci@example.invalid
      EMAIL_PASSWORD: unused
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-bootstrap.txt
      - name: Install pinned packaging tools
        run: python -m pip install -r requirements-bootstrap.txt
      - name: Install and check dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Static checks
        run: |
          make lint
          node --check players/static/players/sorter_players.js
          node --check players/static/players/ajax_switch_stats.js
          node --check players/static/players/sorting_favorites.js
          node --check players/static/players/sorting_comparison.js
      - name: Django system and migration checks
        run: |
          python --version
          python -m django --version
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Offline tests and coverage gate
        id: tests
        # pytest-django creates test_nhl_ci using real migrations.
        run: make test-ci
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - name: Prepare offline Chromium smoke tests
        run: |
          npm --prefix browser ci --ignore-scripts
          python scripts/prepare_browser_assets.py
          npm --prefix browser exec -- playwright install --with-deps --no-shell chromium
      - name: Browser smoke tests
        run: python -m pytest -c players/tests/pytest.ini -m "browser and not external" players/tests/browser
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failures
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Export coverage report
        if: always() && hashFiles('.coverage') != ''
        run: python -m coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('coverage.xml') != ''
        with:
          name: coverage-python312
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14
